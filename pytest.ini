[pytest]
testpaths = legacy_selenium migrated_playwright
pythonpath = .
base_url = https://www.saucedemo.com
# Both suites drive the same installed Google Chrome, so the comparison isolates the tool.
# The Playwright options below are ignored by the Selenium suite.
addopts = -ra --browser-channel=chrome --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
